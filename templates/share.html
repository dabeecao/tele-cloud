<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ filename }} - TeleCloud OS</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    animation: { 
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&display=swap');
        
        body { font-family: 'Nunito', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.65); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.7); 
            box-shadow: 0 20px 40px -10px rgba(31, 38, 135, 0.1); 
        }
        
        .glass-button {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        @media (prefers-color-scheme: dark) {
            .glass-panel { 
                background: rgba(15, 23, 42, 0.65); 
                border: 1px solid rgba(255, 255, 255, 0.1); 
                box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.6); 
            }
            .glass-button {
                background: rgba(30, 41, 59, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .blob-1 { position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%); z-index: -1; filter: blur(40px); animation: float 10s infinite alternate ease-in-out; }
        .blob-2 { position: fixed; bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(168,85,247,0.25) 0%, transparent 70%); z-index: -1; filter: blur(40px); animation: float 12s infinite alternate-reverse ease-in-out; }
        
        @media (prefers-color-scheme: dark) {
            .blob-1 { background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%); }
            .blob-2 { background: radial-gradient(circle, rgba(168,85,247,0.12) 0%, transparent 70%); }
        }

        @keyframes float { 
            0% { transform: translate(0, 0) scale(1); } 
            100% { transform: translate(30px, 30px) scale(1.1); } 
        }
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        :root {
            --plyr-color-main: #3b82f6; 
            --plyr-video-background: rgba(0, 0, 0, 0.2);
            --plyr-menu-background: rgba(15, 23, 42, 0.9);
            --plyr-menu-color: #ffffff;
        }
        .plyr { border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); width: 100%; }
        .plyr__controls { backdrop-filter: blur(10px) !important; background: rgba(15, 23, 42, 0.6) !important; padding: 10px !important; }
        .plyr--audio .plyr__controls { border-radius: 1rem; background: rgba(15, 23, 42, 0.7) !important; }
        @media (prefers-color-scheme: light) {
            .plyr--audio .plyr__controls { background: rgba(255, 255, 255, 0.8) !important; color: #1e293b !important; }
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 relative overflow-x-hidden transition-colors duration-500">
    
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div id="download-overlay" class="fixed inset-0 z-[500] hidden flex-col items-center justify-center bg-slate-900/70 backdrop-blur-md transition-opacity duration-300 opacity-0">
        <i class="fa-solid fa-cloud-arrow-down text-6xl text-blue-400 mb-6 animate-bounce"></i>
        <div class="text-white text-2xl font-bold mb-2 text-center px-4">Đang chuẩn bị file...</div>
        <div class="text-white/70 text-sm mb-6">Kết nối máy chủ Telegram, vui lòng đợi</div>
        <div class="w-48 h-1.5 bg-slate-700 rounded-full overflow-hidden shadow-inner">
            <div class="h-full bg-blue-500 w-1/3 transform translate-x-[-100%]" style="animation: indeterminate 1.5s infinite linear;"></div>
        </div>
    </div>

    <div class="min-h-screen w-full flex items-center justify-center py-12 px-4 relative z-10">
        
        <main id="main-card" class="w-full max-w-lg glass-panel rounded-[2.5rem] p-6 sm:p-10 animate-fade-in-up transition-all duration-500">
            
            <div class="flex items-center justify-center gap-3 mb-8 opacity-80">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-cloud text-xl text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-800 dark:text-white">TeleCloud</h1>
            </div>

            <div id="main-content-grid" class="flex flex-col gap-8 w-full">
                
                <div id="info-section" class="flex flex-col items-center text-center w-full transition-all duration-500">
                    <div id="file-icon-container" class="w-24 h-24 rounded-[2rem] flex items-center justify-center shadow-inner mb-6 transition-all duration-300">
                        <i class="fa-solid fa-file text-5xl"></i>
                    </div>

                    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white break-all line-clamp-3 mb-2 transition-all duration-300" id="raw-filename">{{ filename }}</h2>
                    <p id="file-type-name" class="text-sm font-semibold text-blue-600 dark:text-blue-400 mb-6 uppercase tracking-wider transition-all duration-300">Đang tải...</p>

                    <div class="w-full bg-white/40 dark:bg-slate-900/40 rounded-2xl p-4 border border-slate-200/50 dark:border-slate-700/50 space-y-3 text-sm transition-all duration-300">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 dark:text-slate-400">Kích thước:</span>
                            <span class="font-bold text-slate-800 dark:text-slate-200" id="formatted-size">{{ size }}</span>
                        </div>
                        <div class="h-px w-full bg-slate-200/50 dark:bg-slate-700/50"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 dark:text-slate-400">Ngày tải lên:</span>
                            <span class="font-bold text-slate-800 dark:text-slate-200" id="formatted-date">{{ created_at }}</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-4 w-full justify-center">
                    
                    <div id="media-preview-container" class="w-full mb-2 hidden flex-col items-center justify-center rounded-[1.5rem] p-1.5 glass-button shadow-sm transition-all">
                    </div>
            
                    <form method="POST" action="/s/{{ token }}/dl" target="hidden_download_iframe" id="download-form" class="w-full">
                        <button type="submit" class="group relative w-full flex items-center justify-center gap-3 py-4 rounded-2xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-lg shadow-[0_10px_20px_rgba(37,99,235,0.3)] transition-all active:scale-[0.98] overflow-hidden">
                            <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:animate-[shimmer_1.5s_infinite]"></div>
                            <i class="fa-solid fa-cloud-arrow-down text-2xl animate-bounce"></i>
                            Tải xuống ngay
                        </button>
                    </form>

                    <iframe name="hidden_download_iframe" class="hidden"></iframe>
                    
                    <p class="text-center text-xs text-slate-400 dark:text-slate-500 mt-2 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-shield-halved text-emerald-500 text-sm"></i>
                        Đã quét an toàn bởi hệ thống
                    </p>
                </div>

            </div>

            <footer class="mt-10 text-center relative z-10 opacity-60 hover:opacity-100 transition-opacity">
                <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Powered by <span class="font-bold text-blue-500">TeleCloud OS</span></p>
            </footer>
        </main>
    </div>

    <style>
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rawFilename = document.getElementById('raw-filename').innerText.trim();
            const rawSize = parseInt(document.getElementById('formatted-size').innerText) || 0;
            const rawDate = document.getElementById('formatted-date').innerText;

            function formatBytes(bytes, decimals = 2) {
                if (!+bytes) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
            }
            document.getElementById('formatted-size').innerText = formatBytes(rawSize);

            function formatDate(dateStr) {
                if (!dateStr) return '--';
                const safeString = dateStr.replace(' ', 'T') + 'Z';
                const d = new Date(safeString);
                if (isNaN(d)) return dateStr;
                return d.toLocaleDateString('vi-VN') + ' lúc ' + d.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'});
            }
            document.getElementById('formatted-date').innerText = formatDate(rawDate);

            function applyFileTypeStyling(filename) {
                const ext = filename.split('.').pop().toLowerCase();
                const container = document.getElementById('file-icon-container');
                const typeNameEl = document.getElementById('file-type-name');
                
                const types = {
                    'jpg': { n: 'Tệp Hình ảnh', c: 'bg-rose-100 text-rose-500 dark:bg-rose-500/20 dark:text-rose-400', i: '<i class="fa-solid fa-image text-5xl"></i>' },
                    'jpeg': 'jpg', 'png': 'jpg', 'gif': 'jpg', 'webp': 'jpg', 'svg': 'jpg',
                    'mp4': { n: 'Tệp Video', c: 'bg-purple-100 text-purple-500 dark:bg-purple-500/20 dark:text-purple-400', i: '<i class="fa-solid fa-film text-5xl"></i>' },
                    'mov': 'mp4', 'avi': 'mp4', 'mkv': 'mp4',
                    'mp3': { n: 'Tệp Âm thanh', c: 'bg-amber-100 text-amber-500 dark:bg-amber-500/20 dark:text-amber-400', i: '<i class="fa-solid fa-music text-5xl"></i>' },
                    'wav': 'mp3', 'flac': 'mp3',
                    'php': { n: 'Mã nguồn Lập trình', c: 'bg-indigo-100 text-indigo-500 dark:bg-indigo-500/20 dark:text-indigo-400', i: '<i class="fa-solid fa-code text-5xl"></i>' },
                    'js': 'php', 'html': 'php', 'css': 'php', 'py': 'php', 'json': 'php', 'sql': 'php',
                    'zip': { n: 'Tệp Nén', c: 'bg-orange-100 text-orange-500 dark:bg-orange-500/20 dark:text-orange-400', i: '<i class="fa-solid fa-file-zipper text-5xl"></i>' },
                    'rar': 'zip', 'ipa': 'zip', 'tar': 'zip', 'gz': 'zip', '7z': 'zip', 'apk': 'zip',
                    'pdf': { n: 'Tài liệu PDF', c: 'bg-red-100 text-red-500 dark:bg-red-500/20 dark:text-red-400', i: '<i class="fa-solid fa-file-pdf text-5xl"></i>' },
                    'doc': 'pdf', 'docx': 'pdf', 'xls': 'pdf', 'xlsx': 'pdf', 'txt': 'pdf'
                };

                let result = types[ext];
                if (typeof result === 'string') result = types[result]; 
                
                if (!result) {
                    result = { n: 'Tệp tin (' + ext.toUpperCase() + ')', c: 'bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400', i: '<i class="fa-solid fa-file text-5xl"></i>' };
                }

                container.className = `w-24 h-24 rounded-[2rem] flex items-center justify-center shadow-inner mb-6 transition-all duration-300 ${result.c}`;
                container.innerHTML = result.i;
                typeNameEl.innerText = result.n;
            }

            applyFileTypeStyling(rawFilename);

            const ext = rawFilename.split('.').pop().toLowerCase();
            const previewContainer = document.getElementById('media-preview-container');
            
            const streamUrl = `/s/{{ token }}/stream`;
            const thumbUrl = `/s/{{ token }}/thumb`; 
            
            const hasThumb = {{ 'true' if has_thumb else 'false' }};

            const imgExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'bmp'];
            const videoExts = ['mp4', 'webm', 'ogg', 'mov'];
            const audioExts = ['mp3', 'wav', 'ogg', 'm4a', 'flac'];
            
            const mimeTypes = {
                'mp4': 'video/mp4', 'webm': 'video/webm', 'ogg': 'video/ogg', 'mov': 'video/mp4',
                'mp3': 'audio/mpeg', 'wav': 'audio/wav', 'flac': 'audio/flac', 'm4a': 'audio/mp4'
            };

            let isMedia = false;
            let playerTarget = null;

            if (imgExts.includes(ext)) {
                previewContainer.innerHTML = `<img src="${streamUrl}" alt="${rawFilename}" class="max-h-72 object-contain rounded-[1rem] w-full shadow-lg">`;
                isMedia = true;
            } else if (videoExts.includes(ext)) {
                const typeAttr = mimeTypes[ext] || 'video/mp4';
                const posterAttr = hasThumb ? `data-poster="${thumbUrl}"` : '';
                
                previewContainer.innerHTML = `
                    <div class="w-full relative z-20 rounded-[1rem] overflow-hidden bg-black/5">
                        <video id="tele-player" playsinline controls preload="none" ${posterAttr}>
                            <source src="${streamUrl}" type="${typeAttr}">
                        </video>
                    </div>
                `;
                isMedia = true;
                playerTarget = '#tele-player';
            } else if (audioExts.includes(ext)) {
                const typeAttr = mimeTypes[ext] || 'audio/mpeg';
                const coverHtml = hasThumb ? `<img src="${thumbUrl}" class="w-48 h-48 mx-auto rounded-2xl mb-4 object-cover shadow-md">` : '';
                
                previewContainer.innerHTML = `
                    <div class="w-full relative z-20 rounded-[1rem] overflow-hidden p-2 sm:p-4">
                        ${coverHtml}
                        <audio id="tele-player" controls preload="none">
                            <source src="${streamUrl}" type="${typeAttr}">
                        </audio>
                    </div>
                `;
                isMedia = true;
                playerTarget = '#tele-player';
            }

            if (isMedia) {
                previewContainer.classList.remove('hidden');
                previewContainer.classList.add('flex');
                
                const mainCard = document.getElementById('main-card');
                const contentGrid = document.getElementById('main-content-grid');
                
                const iconContainer = document.getElementById('file-icon-container');
                iconContainer.classList.remove('w-24', 'h-24', 'mb-6', 'rounded-[2rem]');
                iconContainer.classList.add('w-16', 'h-16', 'mb-4', 'rounded-[1.2rem]');
                const icon = iconContainer.querySelector('i');
                if (icon) {
                    icon.classList.remove('text-5xl');
                    icon.classList.add('text-3xl');
                }

                const filenameEl = document.getElementById('raw-filename');
                filenameEl.classList.remove('text-2xl', 'sm:text-3xl', 'mb-2');
                filenameEl.classList.add('text-xl', 'mb-1');

                const typeEl = document.getElementById('file-type-name');
                typeEl.classList.remove('mb-6', 'text-sm');
                typeEl.classList.add('mb-4', 'text-xs');

                const detailsBox = document.querySelector('#file-type-name').nextElementSibling;
                if (detailsBox && detailsBox.tagName === 'DIV') {
                    detailsBox.classList.remove('p-4', 'space-y-3');
                    detailsBox.classList.add('p-3', 'space-y-2');
                }

                if (audioExts.includes(ext)) {
                    mainCard.classList.remove('max-w-lg');
                    mainCard.classList.add('max-w-xl');
                    contentGrid.className = "flex flex-col gap-6 w-full";
                } else {
                    mainCard.classList.remove('max-w-lg');
                    mainCard.classList.add('max-w-4xl');
                    contentGrid.className = "grid grid-cols-1 lg:grid-cols-[1fr_1.5fr] gap-8 w-full items-center";
                }

                if (playerTarget) {
                    setTimeout(() => {
                        const player = new Plyr(playerTarget, {
                            controls: [
                                'play-large', 
                                'play', 
                                'current-time', 
                                'duration', 
                                'mute', 
                                'volume', 
                                'settings', 
                                'pip', 
                                'fullscreen'
                            ],
                            settings: ['speed'],
                            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] }
                        });
                        
                    }, 50);
                }
            }
            
            const form = document.getElementById('download-form');
            const overlay = document.getElementById('download-overlay');

            form.addEventListener('submit', () => {
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
                document.cookie = "dl_started=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

                let checkCookie = setInterval(() => {
                    if (document.cookie.includes('dl_started=1')) {
                        clearInterval(checkCookie);
                        overlay.classList.add('opacity-0');
                        setTimeout(() => {
                            overlay.classList.add('hidden');
                            overlay.classList.remove('flex');
                        }, 300); 
                        document.cookie = "dl_started=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
                    }
                }, 500);

                setTimeout(() => {
                    clearInterval(checkCookie);
                    overlay.classList.add('opacity-0');
                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        overlay.classList.remove('flex');
                    }, 300);
                }, 15000);
            });
        });
    </script>
</body>
</html>
